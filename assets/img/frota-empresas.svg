    <g transform="translate(28, 228)">
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1238">Processos Recentes Atendidos</text>

      <rect y="34" width="616" height="54" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="14" y="48" width="10" height="26" rx="5" fill="#16A34A"/>
      <text x="38" y="58" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Transferência de Propriedade + ATPV-e</text>
      <text x="38" y="76" font-family="Arial, sans-serif" font-size="11.5" fill="#64748B">Pessoa Física • Sumaré / SP</text>
      <rect x="498" y="47" width="102" height="28" rx="14" fill="#DCFCE7"/>
      <text x="549" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#15803D">CONCLUÍDO</text>

      <rect y="100" width="616" height="54" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="14" y="114" width="10" height="26" rx="5" fill="#C91D24"/>
      <text x="38" y="124" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Liberação de Veículo Preso no Pátio</text>
      <text x="38" y="142" font-family="Arial, sans-serif" font-size="11.5" fill="#64748B">Atendimento Urgente • Nova Odessa / SP</text>
      <rect x="498" y="113" width="102" height="28" rx="14" fill="#FEE2E2"/>
      <text x="549" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#C91D24">PRIORIDADE</text>

      <rect y="166" width="616" height="54" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="14" y="180" width="10" height="26" rx="5" fill="#1A2870"/>
      <text x="38" y="190" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Licenciamento Anual &amp; 1º Emplacamento de Frota</text>
      <text x="38" y="208" font-family="Arial, sans-serif" font-size="11.5" fill="#64748B">Empresa PJ • 12 veículos regularizados</text>
      <rect x="498" y="179" width="102" height="28" rx="14" fill="#E8ECF9"/>
      <text x="549" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#1A2870">EMITIDO</text>
