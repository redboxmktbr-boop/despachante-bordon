<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title-frota desc-frota">
  <title id="title-frota">Atendimento Pessoa Física e Empresas / Frotas — Despachante Bordon</title>
  <desc id="desc-frota">Painel moderno de atendimento para pessoa física, empresas e frotas em Sumaré e Nova Odessa.</desc>
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1238"/>
      <stop offset="100%" stop-color="#1E3080"/>
    </linearGradient>
    <filter id="shF" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#05091E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgF)"/>
  <circle cx="120" cy="120" r="170" fill="#C91D24" opacity="0.18"/>
  <circle cx="710" cy="500" r="200" fill="#3B82F6" opacity="0.15"/>

  <!-- Dashboard de Gestão PF & PJ -->
  <g transform="translate(64, 58)" filter="url(#shF)">
    <rect width="672" height="484" rx="22" fill="#FFFFFF"/>
    <!-- Top bar -->
    <path d="M0 22 Q0 0 22 0 L650 0 Q672 0 672 22 L672 68 L0 68 Z" fill="#F1F5F9"/>
    <circle cx="34" cy="34" r="7" fill="#EF4444"/>
    <circle cx="56" cy="34" r="7" fill="#F59E0B"/>
    <circle cx="78" cy="34" r="7" fill="#22C55E"/>
    <text x="114" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#1A2870">DESPACHANTE BORDON — PAINEL PF &amp; EMPRESAS</text>

    <!-- Cards de Resumo -->
    <g transform="translate(28, 92)">
      <rect width="194" height="112" rx="14" fill="#F3F5FC" stroke="#DCE3F5"/>
      <text x="18" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1A2870">PESSOA FÍSICA</text>
      <text x="18" y="64" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0B1238">Atendimento</text>
      <text x="18" y="88" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16A34A">Presencial e Online</text>

      <rect x="211" width="194" height="112" rx="14" fill="#FEF2F2" stroke="#FDE8E8"/>
      <text x="229" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#C91D24">EMPRESAS &amp; FROTAS</text>
      <text x="229" y="64" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0B1238">Gestão PJ</text>
      <text x="229" y="88" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#C91D24">Agilidade em Lote</text>

      <rect x="422" width="194" height="112" rx="14" fill="#ECFDF5" stroke="#BBF7D0"/>
      <text x="440" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#15803D">PREÇO JUSTO</text>
