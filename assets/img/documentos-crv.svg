<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title-crv desc-crv">
  <title id="title-crv">Documentos Veiculares CRV e CRLV-e Padrão Brasil — Despachante Bordon</title>
  <desc id="desc-crv">Ilustração moderna de documento veicular CRV e CRLV-e padrão Brasil com QR Code, placa Mercosul e aprovação rápida.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1238"/>
      <stop offset="55%" stop-color="#1A2870"/>
      <stop offset="100%" stop-color="#24378F"/>
    </linearGradient>
    <linearGradient id="crvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2FAF5"/>
      <stop offset="100%" stop-color="#DCF2E4"/>
    </linearGradient>
    <linearGradient id="crvHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F6A3B"/>
      <stop offset="100%" stop-color="#198754"/>
    </linearGradient>
    <linearGradient id="mercosulBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003399"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05091E" flood-opacity="0.38"/>
    </filter>
    <pattern id="guilloche" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q6 6 12 12 T24 12" fill="none" stroke="#198754" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M0 24 Q6 18 12 24 T24 24" fill="none" stroke="#198754" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fundo institucional -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="690" cy="95" r="180" fill="#C91D24" opacity="0.16"/>
  <circle cx="95" cy="520" r="190" fill="#3B82F6" opacity="0.14"/>

  <!-- Documento CRV / CRLV-e Padrão Brasil (Frente) -->
  <g transform="translate(86, 62)" filter="url(#cardShadow)">
    <rect width="470" height="395" rx="18" fill="url(#crvBg)" stroke="#9AD5B4" stroke-width="2"/>
    <rect width="470" height="395" rx="18" fill="url(#guilloche)"/>

    <!-- Cabeçalho Oficial Verde -->
    <path d="M0 18 Q0 0 18 0 L452 0 Q470 0 470 18 L470 72 L0 72 Z" fill="url(#crvHeader)"/>
    <!-- Selo República / Brasil estilizado -->
    <circle cx="44" cy="36" r="20" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="44" cy="36" r="13" fill="#FACC15" opacity="0.9"/>
    <polygon points="44,27 47,33 53,33 48,37 50,43 44,39 38,43 40,37 35,33 41,33" fill="#0F6A3B"/>

    <text x="78" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#D1FAE5" letter-spacing="1.4">REPÚBLICA FEDERATIVA DO BRASIL • SENATRAN</text>
    <text x="78" y="52" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">CRV / CRLV-e DIGITAL</text>
    <rect x="366" y="21" width="84" height="30" rx="15" fill="#FFFFFF" opacity="0.18"/>
    <text x="408" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">DETRAN-SP</text>

    <!-- Campos do Documento -->
    <g transform="translate(24, 92)">
      <!-- Linha 1 -->
      <rect width="202" height="44" rx="8" fill="#FFFFFF" stroke="#B7E4C7"/>
      <text x="12" y="16" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D">CÓDIGO RENAVAM</text>
      <text x="12" y="34" font-family="monospace" font-size="15" font-weight="700" fill="#0F172A">01284957361</text>

      <rect x="214" width="208" height="44" rx="8" fill="#FFFFFF" stroke="#B7E4C7"/>
      <text x="226" y="16" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D">EXERCÍCIO / SITUAÇÃO</text>
      <text x="226" y="34" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#16A34A">REGULARIZADO ✓</text>

      <!-- Linha 2 -->
      <rect y="56" width="136" height="44" rx="8" fill="#FFFFFF" stroke="#B7E4C7"/>
      <text x="12" y="72" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D">PLACA MERCOSUL</text>
      <text x="12" y="90" font-family="monospace" font-size="15" font-weight="800" fill="#1A2870">BDN4E26</text>

      <rect x="148" y="56" width="136" height="44" rx="8" fill="#FFFFFF" stroke="#B7E4C7"/>
      <text x="160" y="72" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D">CHASSI / MOTOR</text>
      <text x="160" y="90" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A">9BWZZZ377VT...</text>

      <rect x="296" y="56" width="126" height="44" rx="8" fill="#FFFFFF" stroke="#B7E4C7"/>
      <text x="308" y="72" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D">ATPV-e</text>
      <text x="308" y="90" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">EMITIDA</text>

      <!-- Linha 3: QR Code + Dados do Município -->
      <rect y="114" width="290" height="122" rx="10" fill="#FFFFFF" stroke="#B7E4C7"/>
      <text x="14" y="136" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#15803D">LOCAL / ATENDIMENTO</text>
      <text x="14" y="156" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A">SUMARÉ &amp; NOVA ODESSA — SP</text>
      <line x1="14" y1="170" x2="274" y2="170" stroke="#E2E8F0"/>
      <text x="14" y="190" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">DESPACHANTE CREDENCIADO</text>
      <text x="14" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#1A2870">BORDON DOCUMENTOS VEICULAR</text>
      <text x="14" y="226" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Transferência • Licenciamento • Liberação</text>

      <!-- QR Code Vetorial Estilizado -->
      <rect x="304" y="114" width="118" height="122" rx="10" fill="#FFFFFF" stroke="#B7E4C7"/>
      <g transform="translate(321, 126)" fill="#0F172A">
        <rect width="26" height="26" rx="3" fill="none" stroke="#0F172A" stroke-width="4"/>
        <rect x="7" y="7" width="12" height="12" rx="1"/>
        <rect x="58" width="26" height="26" rx="3" fill="none" stroke="#0F172A" stroke-width="4"/>
        <rect x="65" y="7" width="12" height="12" rx="1"/>
        <rect y="58" width="26" height="26" rx="3" fill="none" stroke="#0F172A" stroke-width="4"/>
        <rect x="7" y="65" width="12" height="12" rx="1"/>
        <rect x="34" y="4" width="8" height="8"/>
        <rect x="44" y="14" width="8" height="8"/>
        <rect x="34" y="32" width="12" height="12"/>
        <rect x="52" y="34" width="8" height="16"/>
        <rect x="68" y="36" width="14" height="8"/>
        <rect x="34" y="54" width="10" height="10"/>
        <rect x="50" y="60" width="14" height="14"/>
        <rect x="70" y="56" width="12" height="12"/>
        <rect x="36" y="72" width="10" height="12"/>
        <rect x="68" y="74" width="14" height="10"/>
      </g>
      <text x="363" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#15803D">VALIDAÇÃO DIGITAL</text>
    </g>

    <!-- Faixa Inferior do Documento -->
    <rect x="24" y="344" width="422" height="32" rx="8" fill="#16A34A" opacity="0.12"/>
    <text x="235" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#15803D">✓ DOCUMENTAÇÃO VEICULAR EMITIDA COM AGILIDADE E SEGURANÇA</text>
  </g>

  <!-- Placa Padrão Mercosul Brasil sobreposta -->
  <g transform="translate(455, 398)" filter="url(#cardShadow)">
    <rect width="290" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M2 12 Q2 2 12 2 L278 2 Q288 2 288 12 L288 32 L2 32 Z" fill="url(#mercosulBlue)"/>
    <text x="145" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="3">BRASIL</text>
    <!-- Bandeira BR estilizada -->
    <rect x="246" y="8" width="26" height="17" rx="2" fill="#16A34A"/>
    <polygon points="259,10 269,16.5 259,23 249,16.5" fill="#FACC15"/>
    <circle cx="259" cy="16.5" r="3.6" fill="#1D4ED8"/>
    <text x="18" y="92" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#003399">BR</text>
    <text x="156" y="88" text-anchor="middle" font-family="monospace, Arial" font-size="40" font-weight="900" fill="#0F172A" letter-spacing="2">BDN4E26</text>
  </g>

  <!-- Badge Flutuante Vermelho Bordon -->
  <g transform="translate(520, 128)" filter="url(#cardShadow)">
    <rect width="225" height="92" rx="16" fill="#FFFFFF"/>
    <rect width="8" height="92" rx="4" fill="#C91D24"/>
    <circle cx="42" cy="46" r="20" fill="#FEF2F2"/>
    <path d="M34 46 L40 52 L52 40" fill="none" stroke="#C91D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#0B1238">8 Anos de Experiência</text>
    <text x="74" y="56" font-family="Arial, sans-serif" font-size="11" fill="#475569">Atendimento Presencial</text>
    <text x="74" y="72" font-family="Arial, sans-serif" font-size="11" fill="#475569">e 100% Online</text>
  </g>
</svg>
